<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawab ZADA Sim Database</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --green: #01411C;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px 30px;
            background: var(--green);
        }

        .flag-bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: linear-gradient(90deg, #fff 0%, #fff 25%, var(--green) 25%, var(--green) 100%);
            overflow: hidden;
        }

        .crescent {
            position: absolute;
            left: 62.5%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 34vmin;
            height: 34vmin;
            background: #fff;
            border-radius: 50%;
        }
        .crescent::after {
            content: '';
            position: absolute;
            top: -4vmin;
            right: -2vmin;
            width: 30vmin;
            height: 30vmin;
            background: var(--green);
            border-radius: 50%;
        }

        .star {
            position: absolute;
            left: 69%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 11vmin;
            height: 11vmin;
        }
        .star polygon { fill: #fff; }

        .flag-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.30) 60%, rgba(0,0,0,0.55) 100%);
        }

        .flag-text {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: clamp(30px, 8vw, 100px);
            font-weight: 700;
            white-space: nowrap;
            text-shadow: 0 6px 30px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
        }

        .main-card {
            position: relative;
            margin-top: clamp(130px, 22vh, 220px);
            width: 100%;
            max-width: 560px;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 28px 22px 24px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            border-top: 5px solid var(--green);
        }

        .logo-circle {
            width: 68px;
            height: 68px;
            margin: 0 auto 12px;
            background: var(--green);
            color: #fff;
            font-size: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(1,65,28,0.35);
        }

        .main-card h1 {
            color: var(--green);
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #6d7f74;
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .input-box {
            display: flex;
            border: 2px solid var(--green);
            border-radius: 40px;
            overflow: hidden;
            background: #fff;
            margin-top: 20px;
        }

        .input-box input {
            flex: 1;
            border: none;
            padding: 14px 18px;
            font-size: 15px;
            outline: none;
            color: #1a1a1a;
            min-width: 0;
        }

        .input-box input::placeholder {
            color: #9aa89f;
        }

        .btn-search {
            background: var(--green);
            color: #fff;
            border: none;
            padding: 0 26px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: #013016;
        }

        .loader-box {
            background: #f0f7f2;
            border: 1px solid var(--green);
            border-radius: 12px;
            padding: 28px;
            color: var(--green);
            font-size: 14px;
            margin-top: 20px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #cfe3d6;
            border-top-color: var(--green);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .data-card {
            background: #fff;
            border: 1px solid #dce8e0;
            border-radius: 12px;
            padding: 18px;
            margin-top: 20px;
            text-align: left;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px dashed #d5e3da;
            font-size: 14px;
        }

        .label {
            color: #56705f;
            font-weight: 600;
            white-space: nowrap;
        }

        .value {
            color: #0d2818;
            font-weight: 700;
            word-break: break-word;
            text-align: right;
        }

        .map-title {
            margin-top: 16px;
            font-weight: 700;
            color: var(--green);
            font-size: 14px;
        }

        .map-container {
            height: 230px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #dce8e0;
            margin-top: 8px;
        }

        .not-found {
            margin-top: 20px;
            background: #fdf0f0;
            border: 1px solid #e05252;
            color: #b3261e;
            border-radius: 12px;
            padding: 22px;
            font-weight: 700;
            font-size: 15px;
        }

        .footer {
            margin-top: 22px;
            color: #fff;
            text-align: center;
            font-size: 13px;
            line-height: 1.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
            max-width: 560px;
        }

        .footer .dev {
            font-weight: 700;
            margin-top: 4px;
            color: #ffe28a;
        }
    </style>
</head>
<body>

    <div class="flag-bg">
        <div class="crescent"></div>
        <svg class="star" viewBox="0 0 100 100">
            <polygon points="50,5 60.1,36.1 92.8,36.1 66.4,55.3 76.4,86.4 50,67.2 23.6,86.4 33.6,55.3 7.2,36.1 39.9,36.1"/>
        </svg>
    </div>
    <div class="flag-overlay"></div>
    <div class="flag-text">جشن آزادی مبارک</div>

    <!-- Main Card -->
    <div class="main-card">
        <div class="logo-circle">
            <i class="fas fa-sim-card"></i>
        </div>
        <h1>Nawab ZADA Sim Database</h1>
        <p class="subtitle">Sim Database System</p>

        <div class="input-box">
            <input type="text" id="targetInput" placeholder="Number (3xxxxxxxxx) ya CNIC likhein">
            <button class="btn-search" onclick="startSearch()">search database</button>
        </div>

        <div id="resultArea"></div>
    </div>

    <div class="footer">
        <p>Note:Is tool mein serf 2023 tk ki Sim  ka database majood hy.</p>
        <p class="dev">Developer: Nawab ZADA HACKER</p>
    </div>

    <script src="api.js"></script>
</body>
</html>
